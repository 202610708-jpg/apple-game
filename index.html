<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Mini DOOM - Enhanced Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-frame">
        <!-- 3D Render Screen -->
        <canvas id="viewScreen" width="320" height="200"></canvas>
        
        <!-- Minimap Overlay -->
        <canvas id="minimap" width="80" height="80"></canvas>

        <!-- UI Overlays -->
        <div id="crosshair"></div>
        <div id="weapon-container">
            <div id="muzzle-flash"></div>
            <div id="weapon"></div>
        </div>

        <!-- DOOM HUD -->
        <div id="hud">
            <div class="hud-block"><span class="hud-title">AMMO</span><span id="ammoVal">50</span></div>
            <div class="hud-block"><span class="hud-title">HEALTH</span><span id="healthVal">100%</span></div>
            
            <div id="doomguy-face">
                <div class="eye eye-left"></div>
                <div class="eye eye-right"></div>
                <div class="mouth"></div>
            </div>

            <div class="hud-block"><span class="hud-title">ARMOR</span><span>50%</span></div>
            <div class="hud-block"><span class="hud-title">KILLS</span><span id="killVal">0</span></div>
        </div>
    </div>

    <div id="controls-info">
        이동: <key>W</key><key>S</key> | 회전: <key>A</key><key>D</key> 또는 <key>←</key><key>→</key> | 사격: <key>Space</key> / 마우스 클릭<br>
        <i>* 왼쪽 위에 <b>미니맵</b>이 표시됩니다 (빨간 점: 적, 화살표: 플레이어)</i>
    </div>

    <script src="script.js"></script>
</body>
</html>
